# Iceberg deep-dive script-architect prompt (versioned).
# The version string is recorded in the ledger with every generated script, so
# changing this prompt creates a new, traceable lineage. Bump `version` on edit.
#
# v2: staged generation (outline -> per-entry with running context -> length
# enforcement) plus optional factual grounding. `instructions`/`output_schema`
# below describe the single-shot legacy contract and are retained for `style`
# and `few_shot`; the staged prompts live in src/longform/script.py.
#
# v3: TWO-PASS generation. Pass 1 is the v2 grounded factual skeleton (accurate,
# no drama). Pass 2 re-voices every section as an ominous documentary narrator
# building escalating dread -- visceral cold open, direct address, pacing
# variation, stakes-driven open loops, no encyclopedic phrasing -- WITHOUT
# inventing any new specifics. Shots now carry a dedicated visual SEARCH QUERY
# and a mood, separate from the narration. The narrative-rewrite + shot-query
# prompts live in src/longform/script.py; the `narrative` block below tunes them.
version: iceberg-v3

# Narration pace used to convert production.target_minutes -> a word budget.
target_wpm: 140

# The iceberg shape the model MUST follow.
structure:
  cold_hook:
    seconds: "0-15"
    must:
      - "Name the iceberg explicitly (e.g. 'the <topic> iceberg')."
      - "Tease the single deepest / most unsettling layer WITHOUT revealing it."
      - "Promise the payoff: that we descend tier by tier to reach it."
  tiers:
    order: "surface -> obscure -> deepest/most unsettling"
    each_entry_must:
      - "Belong to a labelled tier (Surface, Shallows, Deep, Abyss, Bedrock...)."
      - "Have an entry_title (the thing on the iceberg chart)."
      - "Have narration that explains it in plain, vivid language."
      - "Have a shot_list: 2-4 concrete visual directions for that entry."
      - "End on a mini open-loop that teases the NEXT, deeper tier."
  final_payoff:
    must:
      - "Resolve the deepest layer the cold_hook promised."
      - "Close the loop so the title is fully paid off."

# Output contract: the model must return ONLY this JSON object, no prose.
output_schema: |
  {
    "iceberg_topic": "<topic>",
    "cold_hook": "<spoken cold open, 0-15s>",
    "tiers": [
      {
        "tier": 1,
        "label": "Surface",
        "entry_title": "<chart entry>",
        "narration": "<spoken narration for this entry>",
        "shot_list": ["<shot 1>", "<shot 2>"],
        "open_loop": "<one line teasing the next, deeper tier>"
      }
    ],
    "final_payoff": "<spoken close that resolves the deepest layer>"
  }

# Pass 2 (NARRATIVE REWRITE) tuning. The factual skeleton from Pass 1 is
# re-voiced section by section into cinematic, escalating-dread narration. The
# few-shot lines below set the TONE only -- the model must never reuse their
# wording or their facts, only their cadence and menace.
narrative:
  rules:
    - "Rewrite, never restate: keep every name, date, number and fact from the source EXACTLY; invent NO new specifics."
    - "Cold open must land a visceral hook in the first 2-3 sentences -- a disturbing question, a stake, an unsettling image. NEVER 'Welcome to the X iceberg'."
    - "Speak to the viewer: use 'you', 'imagine', 'you've seen this before' to pull them in."
    - "Escalate: each tier must feel DARKER and more unsettling than the one before -- emotion and dread, not just rarer trivia."
    - "Vary the pacing: mix short, punchy dread-beats with longer descriptive lines. No monotone paragraphs."
    - "End each tier on an open loop with STAKES ('but what they found next should not have existed'), never 'next, we'll look at...'."
    - "Strip encyclopedic phrasing ('is a fictional', 'refers to', 'is a concept'), hedging, and filler. Documentary narrator, not Wikipedia."
  # Tone exemplars (cadence + menace only -- do NOT copy wording or topics).
  few_shot:
    - "You were never supposed to find this. Most people scroll past it and feel nothing. But once you see what's underneath, you can't unsee it -- and it goes so much deeper than they let on."
    - "It starts with something harmless. A blurry photo. A rumor. The kind of thing you'd laugh off. Then the dates stop lining up, the witnesses stop talking, and the laughter dies in your throat."
    - "Stay with me, because this is where it stops being a story. The deeper we go, the less of it anyone can explain -- and the last layer is the one they hoped you'd never reach."

# Style guidance, refreshed at runtime with REAL top performers from farm.db
# (their titles + durations) so the model imitates proven winners, not priors.
style:
  voice: "calm, authoritative documentary narrator; second-person sparingly"
  pacing: "short sentences; each tier escalates dread/curiosity"
  avoid:
    - "breaking the fourth wall or mentioning that this is AI/script"
    - "revealing the deepest layer before the final_payoff"
    - "filler like 'in this video' or 'don't forget to subscribe'"

instructions: |
  You are an expert long-form YouTube script architect specialising in
  "iceberg" explainer videos. Write a complete narration script for the iceberg
  on the given TOPIC.

  Follow the iceberg STRUCTURE exactly: a 0-15s cold_hook that names the iceberg
  and teases (but never reveals) the deepest layer, then TIERED entries ordered
  surface -> obscure -> deepest. Every entry ends on a mini open-loop teasing the
  next deeper tier. Finish with a final_payoff that resolves the deepest layer.

  Produce roughly {word_budget} words of narration total (cold_hook + all
  narration + final_payoff), at about {target_wpm} words/minute for a
  {target_minutes}-minute video. Aim for {tier_hint} tiers.

  These are REAL top-performing iceberg videos (title — runtime) to imitate in
  tone, scope, and escalation. Match their style; do NOT copy their topics:
  {few_shot}

  Return ONLY the JSON object described by the schema. No markdown, no commentary.
